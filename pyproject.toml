[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.4.0"
description = "A free, hackable AI assistant that controls your laptop."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "ddgs>=9.0.0",
    "psutil>=5.9.0",
    "mss>=9.0.0",
    "pycaw; sys_platform == 'win32'",
    "comtypes; sys_platform == 'win32'",
    "screen-brightness-control; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
"jarvis.ui" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
